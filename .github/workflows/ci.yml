name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (jest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electric-kar
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: electric-kar/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm test
      - run: pnpm build

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electric-kar-front
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: electric-kar-front/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --watch=false
      - run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ek
          POSTGRES_PASSWORD: ek
          POSTGRES_DB: electrickar_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ek"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ek:ek@localhost:5432/electrickar_db?schema=public
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 1d
      APP_FRONT_URL: http://localhost:4200
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            electric-kar/pnpm-lock.yaml
            electric-kar-front/pnpm-lock.yaml

      # --- Backend: migrate, seed, build, start ---
      - name: Backend install
        working-directory: electric-kar
        run: pnpm install --frozen-lockfile
      - name: Prisma generate + deploy + seed
        working-directory: electric-kar
        run: |
          pnpm prisma:generate
          pnpm prisma:deploy
          pnpm db:seed
      - name: Backend build
        working-directory: electric-kar
        run: pnpm build
      - name: Start backend (:3000)
        working-directory: electric-kar
        env:
          PORT: "3000"
        run: node dist/main &

      # --- Frontend: build, install browser, start SSR ---
      - name: Frontend install
        working-directory: electric-kar-front
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: electric-kar-front
        run: pnpm exec playwright install --with-deps chromium
      - name: Frontend build
        working-directory: electric-kar-front
        run: pnpm build
      - name: Start SSR server (:4200)
        working-directory: electric-kar-front
        env:
          PORT: "4200"
        run: node dist/electric-kar-front/server/server.mjs &

      - name: Wait for both servers
        run: npx --yes wait-on -t 60000 http://localhost:3000/api/products http://localhost:4200

      - name: Run Playwright
        working-directory: electric-kar-front
        run: pnpm exec playwright test --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: electric-kar-front/playwright-report/
          retention-days: 7

  backend-functional:
    name: Backend (functional)
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        working-directory: electric-kar
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ek
          POSTGRES_PASSWORD: ek
          POSTGRES_DB: electrickar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ek"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ek:ek@localhost:5432/electrickar_test?schema=public
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 1d
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: electric-kar/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma:deploy
      - run: pnpm test:functional
