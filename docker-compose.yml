# Base de datos local para desarrollo (electric-kar-tienda)
#
# Uso:
#   docker compose up -d            # levanta PostgreSQL en segundo plano
#   docker compose down             # detiene y elimina el contenedor (conserva el volumen)
#   docker compose down -v          # elimina también los datos persistidos
#
# Las credenciales coinciden con electric-kar/.env.example:
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/electric_kar?schema=public
#
# Tras levantar los servicios, desde electric-kar/:
#   pnpm install && pnpm prisma:deploy && pnpm db:seed && pnpm search:reindex && pnpm start:dev
#
# Servicios: postgres (electric-kar-db, :5432) y typesense (electric-kar-search, :8108).

services:
  postgres:
    image: postgres:16-alpine
    container_name: electric-kar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: electric_kar
    ports:
      - "5432:5432"
    volumes:
      - electric_kar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d electric_kar"]
      interval: 5s
      timeout: 5s
      retries: 10

  typesense:
    image: typesense/typesense:27.1
    container_name: electric-kar-search
    restart: unless-stopped
    command: '--data-dir /data --api-key=${TYPESENSE_API_KEY:-dev_local_key} --enable-cors'
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev_local_key}
    ports:
      - "8108:8108"
    volumes:
      - electric_kar_typesense:/data
    healthcheck:
      # La imagen de Typesense no incluye curl/wget; usamos bash /dev/tcp contra /health
      # (grep 'ok' en minúscula matchea el body {"ok":true}, no el "200 OK" del status line).
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/localhost/8108 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && grep -q ok <&3']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  electric_kar_pgdata:
    name: electric_kar_pgdata
  electric_kar_typesense:
    name: electric_kar_typesense
